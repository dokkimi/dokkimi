name: crash-broker
description: A broker exits at startup, so the definition fails with its logs instead of a timeout
config:
  timeoutSeconds: 120
items:
  - type: SERVICE
    name: service
    image: node:20-alpine
    port: 3000
    healthCheck: /
    command:
      - node
      - -e
      - require('http').createServer((req, res) => res.end()).listen(3000)
  - type: BROKER
    name: broker
    broker: amqp
    version: '3'
    command: [sh, -c, 'sleep 2; echo "error: bad config"; exit 1']
tests:
  - name: Should never run
    steps:
      - action: { type: httpRequest, method: GET, url: service/ }

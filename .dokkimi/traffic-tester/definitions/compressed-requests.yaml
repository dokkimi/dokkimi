      - name: The client sends the request to a service
        action: { type: httpRequest, method: GET, url: client/br/receiver }
        assertions:
          - assertions:
              - { path: $.response.body.encoding, operator: eq, value: br }
              - { path: $.response.body.q, operator: eq, value: classify }
          - match:

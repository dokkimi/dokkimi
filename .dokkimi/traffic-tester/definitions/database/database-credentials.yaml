name: database-credentials
description: |
  Databases with credentials Dokkimi used to get wrong: a password with URL
  characters, noAuth Postgres and MySQL, MySQL as root, and a MongoDB init
  script that doesn't choose its database (it must run against dbName).
config:
  timeoutSeconds: 120
items:
  - type: DATABASE
    name: pg-password
    database: postgres
    dbPassword: 'p@ss/w:rd?x'
  - type: DATABASE
    name: pg-noauth
    database: postgres
    noAuth: true
  - type: DATABASE
    name: mysql-noauth
    database: mysql
    noAuth: true
  - type: DATABASE
    name: mysql-root
    database: mysql
    dbUser: root
    dbPassword: secret
  - type: DATABASE
    name: mongo-shop
    database: mongodb
    dbName: shop
    initFilePath: ../../init-files/init-mongo-default-db.js
tests:
  - name: Each database is reachable with its credentials
    steps:
      - name: Postgres with a password full of URL characters
        action:
          { type: dbQuery, database: pg-password, query: 'SELECT 1 AS one' }
        assertions:
          - assertions:
              [{ path: $.response.success, operator: eq, value: true }]
      - name: Postgres without authentication
        action: { type: dbQuery, database: pg-noauth, query: 'SELECT 1 AS one' }
        assertions:
          - assertions:
              [{ path: $.response.success, operator: eq, value: true }]
      - name: MySQL without authentication
        action:
          { type: dbQuery, database: mysql-noauth, query: 'SELECT 1 AS one' }
        assertions:
          - assertions:
              [{ path: $.response.success, operator: eq, value: true }]
      - name: MySQL as root
        action:
          { type: dbQuery, database: mysql-root, query: 'SELECT 1 AS one' }
        assertions:
          - assertions:
              [{ path: $.response.success, operator: eq, value: true }]
      - name: The MongoDB init script wrote to dbName
        action:
          type: dbQuery
          database: mongo-shop
          query: '{"operation":"find","collection":"seeded","filter":{}}'
        assertions:
          - assertions: [{ count: $.response.data, operator: eq, value: 1 }]
